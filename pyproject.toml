[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-telemetry-agent"
version = "0.1.0"
description = "Local developer telemetry agent for Antigravity AI usage and engineering signals"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Engineering Telemetry Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
telemetry-agent = "ai_telemetry_agent.cli:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_telemetry_agent*"]

[tool.setuptools.package-data]
ai_telemetry_agent = ["*.json", "integrations/hooks/*.json", "integrations/mcp_probe/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

