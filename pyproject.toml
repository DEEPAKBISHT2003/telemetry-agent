[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-telemetry-collector"
version = "0.1.0"
description = "Local developer telemetry collector for AI usage and engineering signals"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Engineering Telemetry Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
telemetry-agent = "src.main:cli_entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
